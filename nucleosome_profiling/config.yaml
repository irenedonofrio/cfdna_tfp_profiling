deployment:
  # Refs bundled in the project, resolved by config_helper.py: refs_root is anchored
  # to THIS config's folder (nucleosome_profiling/), so ../refs -> <repo>/refs, and the
  # four ref entries below join onto it. Override with the TFP_REFS env var if refs are
  # mounted outside the repo (container).
  refs_root:     ../refs
  reference_fa:  hg38.fa                                                   # + hg38.fa.fai beside it
  mappable_bed:  k100_minus_exclusion_lists.mappable_regions.hg38.bed
  chrom_sizes:   hg38.standard.chrom.sizes
  tf_dir:        TFBS_10000ms          # relative to refs_root — assumes the TF beds were
                                       # moved into refs/. If they live elsewhere, put an
                                       # ABSOLUTE path here (absolute values pass through).
  # Generated Stage-2 sheet, written next to this config by build_stage2_sheet.py:
  sample_sheet:  samples.tsv           # relative -> nucleosome_profiling/samples.tsv
  # Outputs inside the project (anchored to this config's folder). Per sample,
  # <repo>/results/samples/<id>/ then holds fcc/, profiling/, logs/, all_TF_features.tsv.
  results_root:  ../results/samples
  fcc_root:      ../results/samples
  tmpdir:        /tmp
  threads:       4
method:
  mapq:          30
  gc_bias_min:   0.05
  frag_len_min:  120
  frag_len_max:  200
  window_size:      5000
  step:             15
  smoothing_length: 165
  fft_window:       960
  fft_index:        10
  center_window:    30
  save_window:      1000
  autosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12,
              chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22]
